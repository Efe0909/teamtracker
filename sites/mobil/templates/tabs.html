{# fragment: mobile_tabs — alt sekme cubugu. Ortadaki + yeni kayit acar. #}
<nav class="tabs" data-fragment="mobile_tabs">
  <div class="in">
    {% for t in tabs %}
      {% if loop.index == 3 %}
      <div class="fab"><a href="{{ mp }}/yeni" aria-label="Yeni kayıt">+</a></div>
      {% endif %}
      <a class="tab{% if t.slug == tab %} on{% endif %}" href="{{ t.href }}">
        <span class="i">{{ t.icon }}</span>{{ t.label }}
        {% if t.slug == 'bildirimler' and badge %}<span class="cnt">{{ badge }}</span>{% endif %}
      </a>
    {% endfor %}
  </div>
</nav>
