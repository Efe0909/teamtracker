{# fragment: rail — sol ray. Kendi kokunu dondurur. #}
<nav class="rail" data-fragment="rail">
  <a class="rlogo" href="/" title="Ana sayfa" style="text-decoration:none">◆</a>
  <button class="rbtn{% if panel != 'tree' %} on{% endif %}" data-mode="inbox"
          hx-get="/panel/inbox" hx-target="#pbody" hx-swap="outerHTML">
    🏠<span class="lbl">Bana ait</span></button>
  <button class="rbtn{% if panel == 'tree' %} on{% endif %}" data-mode="tree"
          hx-get="/panel/tree" hx-target="#pbody" hx-swap="outerHTML">
    🌳<span class="lbl">Hiyerarşi</span></button>
  <div style="flex:1"></div>
  <details style="position:relative">
    <summary class="rbtn" style="list-style:none">
      <span class="av" style="background:{{ user.color }}">{{ user.name[0] }}</span></summary>
    <div class="pop on" style="position:absolute;left:48px;bottom:0;top:auto;width:200px">
      <div class="small" style="padding:2px 6px 8px">
        <b>{{ user.name }}</b><br><span class="muted">{{ user.email }}</span></div>

      {% if sahte_kimlik() %}
      {# Kullanici degistirme YALNIZCA gelistirme modunda; yayinda bu rota yok. #}
      <div class="small muted" style="padding:6px 6px 5px;border-top:1px solid var(--line)">
        Kullanıcı değiştir (sahte kimlik)</div>
      {% for u in all_users %}
      <form method="post" action="/switch/{{ u.id }}" style="margin:0"><input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="tnode" style="width:100%;border:none;background:transparent">
          <span class="av" style="background:{{ u.color }}">{{ u.name[0] }}</span>
          <span class="tn" style="text-align:left">{{ u.name }}</span>
          {% if u.is_admin %}<span class="tb h1">admin</span>{% endif %}
        </button>
      </form>
      {% endfor %}
      {% endif %}

      <form method="post" action="/cikis" style="margin:6px 0 0;border-top:1px solid var(--line);padding-top:6px"><input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="tnode" style="width:100%;border:none;background:transparent">
          <span class="tw">⏻</span><span class="tn" style="text-align:left">Çıkış</span>
        </button>
      </form>
    </div>
  </details>
</nav>
