{# fragment: card_fields — alan seridi.

   DROPDOWN YOK (kullanici istegi, figure2): her alan bir dialog aciyor.
   Bir <select> tek dokunusla sorumluyu degistiriyordu; artik degisim iki
   adim — bilincli bir hareket. Dialoglar bu parcanin ICINDE durur, htmx
   parcayi degistirince kendiliginden kapanirlar (ortak/alan.html).

   HAPIN TAMAMI TIKLANABILIR (alan.pill): eskiden yalniz degerin kendisi
   dugmeydi, etikete ya da bosluga basmak hicbir sey yapmiyordu.

   Her degisim akisa zaman damgali bir sistem olayi yaziyor
   (service.change_field) — "kim ne zaman degistirdi" gorunur kalir.

   Yetki: sablon sadece can_edit'e gore soluklastirir; asil kontrol PATCH
   ucunda. Son tarih AYRICA edit_deadline kapsami ister (goc 012). #}
{% import "ortak/alan.html" as alan %}
{% set url = "/item/" ~ item.id ~ "/field" %}
<div class="strip" id="fields" data-fragment="card_fields">
  {% call alan.pill("dlg-f-status", "Durum", can_edit) %}
    <span class="v v-{{ item.status }}">{{ status_label }}</span>
  {% endcall %}

  {% call alan.pill("dlg-f-priority", "Öncelik", can_edit) %}
    <span class="v v-{{ item.priority }}">{{ priority_label }}</span>
  {% endcall %}

  {% call alan.pill("dlg-f-team", "Takım", can_edit) %}
    {% if team %}<span class="tdot" style="background:{{ team.color }}"></span>{% endif %}
    <span class="v">{{ team.name if team else '—' }}</span>
  {% endcall %}

  {# Pillar ORTOGONAL: kayit agacta bir yerde durur, ayrica bir pillar'a
     sayilir — ikisi birbirinin atasi olmak zorunda degil (goc 012). #}
  {% call alan.pill("dlg-f-pillar", "Pillar", can_edit) %}
    <span class="v">{{ pillar or '—' }}</span>
  {% endcall %}

  {% call alan.pill("dlg-f-who", "Sorumlu", can_edit) %}
    {% if assignee %}<span class="av" style="background:{{ assignee.color }}">{{ assignee.name[0] }}</span>{% endif %}
    <span class="v">{{ assignee.name if assignee else '—' }}</span>
  {% endcall %}

  {% call alan.pill("dlg-f-due", "Son tarih", can_edit) %}
    <span class="v">{{ item.due_date or '—' }}</span>
  {% endcall %}

  {% if item.dms %}<span class="fld ro"><span class="k">DMS</span><span class="v">{{ item.dms }}</span></span>{% endif %}

  <div style="flex:1"></div>
  {% if creator %}<span class="small muted">Açan: {{ creator.name }} · {{ created }}</span>{% endif %}
  <div class="stack">
    {% for p in participants %}<span class="av" style="background:{{ p.color }}">{{ p.name[0] }}</span>{% endfor %}
  </div>
  {% if not can_edit %}<span class="lock">🔒 salt okunur — kapsamın dışında</span>{% endif %}

  {% if can_edit %}
    {{ alan.choice("dlg-f-status", "Kayıt durumu", "status", url, "#fields",
                   statuses.items()|list, item.status,
                   "Açık eylem varken kayıt kapanmaz.") }}
    {{ alan.choice("dlg-f-priority", "Öncelik", "priority", url, "#fields",
                   priorities.items()|list, item.priority) }}
    {# team_options ucuncu oge olarak RENK tasir (routes.card_ctx) — secim
       ekraninda da takimin rengi gorunsun (kullanici istegi). #}
    {{ alan.choice("dlg-f-team", "Takım", "team_id", url, "#fields",
                   team_options, item.team_id or "") }}
    {{ alan.choice("dlg-f-pillar", "Pillar", "pillar_node_id", url, "#fields",
                   pillar_options, item.pillar_node_id or "",
                   "Pillar hiyerarşiden bağımsız: kayıt ağaçta başka yerde durabilir.") }}
    {{ alan.choice("dlg-f-who", "Sorumlu", "assignee_id", url, "#fields",
                   [("", "—")] + user_options, item.assignee_id or "",
                   "Değişiklik akışa zaman damgasıyla düşer.") }}
    {{ alan.date("dlg-f-due", "Kaydın son tarihi", "due_date", url, "#fields",
                 item.due_date, not can_edit_deadline) }}
  {% endif %}
</div>
{% if oob_feed %}
  {% with oob = True %}{% include "ortak/akis.html" %}{% endwith %}
{% endif %}
