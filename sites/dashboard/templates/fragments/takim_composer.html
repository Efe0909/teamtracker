{# fragment: takim_composer — takim duvarina mesaj (spec/20-sema.md §2a).
   Kart kompozeriyle ayni bicim, hedefi farkli: uc /takim/{id}/mesaj.
   Yetki: sablon kutuyu kilitler, asil kontrol POST ucunda (403). #}
<form class="comp" data-fragment="takim_composer" hx-post="/takim/{{ team.id }}/mesaj"
      hx-target="#feed" hx-swap="beforeend">
  <input name="body" placeholder="{{ 'Takıma yaz…' if can_post else 'Bu takımın üyesi değilsin — duvar salt okunur' }}"
         autocomplete="off" {% if not can_post %}disabled{% endif %}>
  <button class="primary" {% if not can_post %}disabled{% endif %}>Gönder</button>
</form>
