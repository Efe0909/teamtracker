{# fragment: panel_tree — hiyerarsi. Girinti depth ile, rozet acik kayit sayisi. #}
{% if oob_head %}<div class="ptitle" id="ptitle" hx-swap-oob="true">{{ panel_title }}</div>{% endif %}
<div class="pbody" id="pbody" data-fragment="panel_tree">
  {% for n in tree %}
  <div class="tnode{% if n.id == selected_node %} on{% endif %}"
       style="margin-left:{{ n.depth * 14 }}px"
       hx-get="/node/{{ n.id }}/items" hx-target="#pbody" hx-swap="outerHTML">
    <span class="tw">{{ '·' if n.leaf else '▼' }}</span>
    <span class="tn">{{ n.name }}</span>
    <span class="tb {% if n.count == 0 %}h0{% elif n.count < 3 %}h1{% elif n.count < 5 %}h2{% else %}h3{% endif %}">{{ n.count }}</span>
  </div>
  {% endfor %}
</div>
