<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ item.title }} — EkipTakip</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/d/dashboard.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
{% include "fragments/uyari_mobil.html" %}
{% with aktif = "gorevler" %}{% include "fragments/rail.html" %}{% endwith %}

<div class="wrapmain" id="main">
  {% include "fragments/card.html" %}
</div>

<script>
/* Gonderilen form temizlenir; akis en alta kayar. hx-on= yok (CSP). */
document.body.addEventListener('htmx:afterRequest', e => {
  const f = e.target.closest('form');
  if (f && e.detail.successful) f.reset();
});
function feedBottom(){ const f = document.getElementById('feed'); if (f) f.scrollTop = f.scrollHeight; }
document.body.addEventListener('htmx:afterSwap', feedBottom);
window.addEventListener('load', feedBottom);
</script>
</body>
