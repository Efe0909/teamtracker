[package]
name = "ekiptakip"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
chrono = "0.4.45"
image = "0.25.10"
minijinja = { version = "2.24.0", features = ["loader"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
