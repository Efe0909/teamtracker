[package]
name = "ekiptakip"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "form"] }
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Kodu cogunlukla derleyici gozden geciriyor: istekte patlayan her kisayol
# derlemeyi dusurur. `todo!()` bir kez yayinda 502 uretti (KNOW-288).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
