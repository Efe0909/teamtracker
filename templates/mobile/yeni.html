{% extends "mobile/base.html" %}

{% block top_left %}
<a class="slot" href="/m" aria-label="Geri">‹</a>
{% endblock %}

{% block content %}
<form class="mform" method="post" action="/m/yeni">
  <div>
    <label>Düğüm (zorunlu)</label>
    <select name="node_id" required>
      {% for n in nodes %}<option value="{{ n.id }}">{{ n.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label>Tür</label>
    <select name="kind">
      <option value="hata">Hata</option>
      <option value="gorev">Görev</option>
    </select>
  </div>
  <div>
    <label>Başlık</label>
    <input name="title" required autocomplete="off" placeholder="Kısa ve arananabilir bir başlık">
  </div>
  <div>
    <label>Açıklama</label>
    <textarea name="description" placeholder="Ne oldu, nerede, ne zaman?"></textarea>
  </div>
  <button class="primary">Kaydı aç</button>
  {% if not nodes %}
  <div class="mempty">Kapsamında kayıt açabileceğin düğüm yok.</div>
  {% endif %}
</form>
{% endblock %}

{% block bottom %}{% endblock %}
