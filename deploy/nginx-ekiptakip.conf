# EkipTakip — nginx ters vekil, iki alan adi.
#
# Zincir:  cloudflared (TLS burada biter, catch-all) → nginx :8080 → uvicorn 127.0.0.1:8000
#
#   app.polonyum.com        → mobil site (kokte: /, /ara, /eylemler, /bildirimler)
#   dashboard.polonyum.com  → masaustu (ana sayfa, /gorevler, moduller)
#
# Ayrim BURADA yapiliyor (server_name). Uygulama Host basligina bakip mobil
# yolu kokte servis ediyor; bunun icin systemd biriminde su iki degisken var:
#   EKIPTAKIP_HOST_APP / EKIPTAKIP_HOST_DASHBOARD
#
# Kurulum:
#   sudo cp deploy/olusan/nginx-ekiptakip.conf /etc/nginx/sites-available/ekiptakip
#   sudo ln -s /etc/nginx/sites-available/ekiptakip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream ekiptakip {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- 1) BILINMEYEN HOST: kapali ------------------------------------------
# Tunel catch-all ise, tunele dusen her isim buraya gelir. Bu blok olmazsa
# ilk server blogu varsayilan olur ve rastgele bir isim uygulamayi acar.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;                       # baglantiyi cevapsiz kapat
}

# --- ortak ayarlar --------------------------------------------------------
# (iki server blogunda da tekrar ediyor; nginx'te include ile de ayirabilirsin)

server {
    listen 127.0.0.1:8080;
    server_name app.polonyum.com;     # ← MOBIL
    include /etc/nginx/snippets/ekiptakip-ortak.conf;
}

server {
    listen 127.0.0.1:8080;
    server_name dashboard.polonyum.com;   # ← MASAUSTU
    include /etc/nginx/snippets/ekiptakip-ortak.conf;
}
