# EkipTakip — nginx ters vekil.
#
# Zincir:  cloudflared (TLS burada biter) → nginx :8080 → uvicorn 127.0.0.1:8000
#
# Kurulum:
#   sudo cp deploy/nginx-ekiptakip.conf /etc/nginx/sites-available/ekiptakip
#   sudo ln -s /etc/nginx/sites-available/ekiptakip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ROOT'u kendi yoluna göre değiştir (repo nerede duruyorsa).

upstream ekiptakip {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;          # sadece tünel erişsin, makine dışına açılmasın
    server_name _;

    # --- KAPI ---------------------------------------------------------------
    # alpha-0.1'in kendi kimlik dogrulamasi YOK (README "Bilgi güvenliği").
    # Tercihen Cloudflare Access kullan (deploy/README.md); onu kurduysan bu üç
    # satırı kapat. Basic auth kalacaksa parolayı şöyle üret:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-ekiptakip efe
    auth_basic           "EkipTakip";
    auth_basic_user_file /etc/nginx/.htpasswd-ekiptakip;

    # --- guvenlik basliklari ------------------------------------------------
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header Referrer-Policy           "same-origin"     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # CSP: sablonlarda satir ici <script> ve hx-on: var, o yuzden script/style'da
    # 'unsafe-inline' duruyor. Dis kaynak yok — hepsi ayni kokten.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 2m;        # dosya yukleme yok, kucuk kalsin
    proxy_http_version   1.1;
    proxy_set_header     Host              $host;
    proxy_set_header     X-Real-IP         $remote_addr;
    proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header     X-Forwarded-Proto https;   # TLS cloudflared'de bitiyor
    proxy_set_header     Connection        "";
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    # NOT: nginx'te bir location kendi add_header'ini yazarsa, server seviyesindeki
    # add_header'lari MIRAS ALMAZ. Asagidaki bloklarda gereken basliklar bu yuzden
    # tekrar yaziliyor.

    # --- service worker: ASLA uzun onbelleklenmez ---------------------------
    # Eski sw.js takili kalirsa telefon gunlerce eski surumu servis eder.
    location = /sw.js {
        proxy_pass http://ekiptakip;
        proxy_hide_header Cache-Control;          # uygulamaninkini gizle, cift baslik olmasin
        add_header Cache-Control        "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/"      always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- statik dosyalar: nginx'ten, uygulamayi mesgul etme -----------------
    # expires kendisi Cache-Control yaziyor; ikinci kez add_header ile yazma.
    location /static/ {
        alias /home/efe/projects/teamtracker/static/;    # ← KENDİ YOLUN
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # manifest daha sik degisir — kisa omur
    location = /static/manifest.json {
        alias /home/efe/projects/teamtracker/static/manifest.json;   # ← KENDİ YOLUN
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://ekiptakip;
    }
}
