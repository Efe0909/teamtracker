# EkipTakip — iki server blogunun paylastigi govde (konteyner yigini).
# nginx-ekiptakip-docker.conf bunu iki server blogundan include eder.
#
# Kurulum: /etc/nginx/snippets/ekiptakip-docker-ortak.conf

# --- KAPI -----------------------------------------------------------------
# alpha-0.1'in kendi kimlik dogrulamasi YOK (README "Bilgi güvenliği").
# Tercihen Cloudflare Access (tunelin ONUNDE). Access kullanmiyorsan ac:
#   sudo htpasswd -c /etc/nginx/.htpasswd-ekiptakip efe
# auth_basic           "EkipTakip";
# auth_basic_user_file /etc/nginx/.htpasswd-ekiptakip;

# --- guvenlik basliklari --------------------------------------------------
add_header X-Frame-Options        "DENY"        always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "same-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
# CSP: sablonlarda satir ici <script> var, o yuzden 'unsafe-inline'. 'unsafe-eval'
# YOK — sablonlarda hx-on= kullanilmiyor (htmx onu new Function ile derler).
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

# --- yukleme siniri: medya ekleri (sozlesme §1 — 10 MB, tek dosya) --------
# 10 MB'lik gorselin kendisine multipart govde (sinir dizesi, form alani
# basliklari, `image` alaninin kendi Content-Type'i) birkac KB ekler. Siniri
# tam 10m birakirsan sinirin hemen ustundeki yuklemeler nginx'te KESILIR:
# istek uygulamaya hic ULASMAZ, ekiptakip'in kendi loglarinda hicbir iz
# birakmaz, yalnizca nginx erisim/hata gunlugunde gorunur. Boyle bir 413
# kafa karistirir — "uygulama neden boyle donuyor" diye aranir ama sorumlu
# katman nginx'tir, uygulama degil.
#
# 12m'e cikarken uygulamanin kendi erken reddini de goz onunde tut
# (shared/media.py cagrilmadan once rota Content-Length'e ~11 MB ustunde
# bakip erken reddeder — sozlesme §7): 12m, o esigin BIR TIK ustunde, boylece
# 10-11 MB araligindaki govdeler nginx'te degil UYGULAMADA reddedilir ve
# kullanici Turkce, anlamli bir hata gorur ("dosya cok buyuk") — cikta cikan
# nginx'in duz 413 sayfasi degil.
client_max_body_size 12m;
#
# proxy_request_buffering: varsayilan "on" BILEREK degistirilmiyor. "off"
# govdeyi nginx'te biriktirmeden dogrudan uygulamaya akitirdi — 10 MB gibi
# kucuk bir sinirda kazanci yok, ama Dockerfile'daki `--workers 1` ZORUNLULUGU
# (agac indeksi surec belleginde, spec/10-kararlar.md) TEK uvicorn surecinin
# yavas/kotu niyetli bir yuklemeyle mesgul tutulmasina daha acik hale gelirdi.
# "on" kalinca nginx govdeyi once kendi tarafinda tamamliyor, uygulamaya
# istek TAMAMLANMADAN dusmuyor.
proxy_http_version   1.1;
proxy_set_header     Host              $host;      # alan adi ayrimi buna bagli
proxy_set_header     X-Real-IP         $remote_addr;
proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header     Connection        "";
proxy_read_timeout   30s;
proxy_send_timeout   30s;

# TLS cloudflared'de bitiyor: nginx'e duz http geliyor, ama tarayici HTTPS
# konusuyor. $scheme YAZMA — 'http' olur ve iki sey birden kirilir:
#   1. kimlik.py:162 redirect_uri'yi request.url_for ile kurar; Google'a
#      http://... gider, kayitli https adresiyle uyusmaz (redirect_uri_mismatch).
#   2. Yayin kipinde cerez __Secure- onekli ve Secure bayrakli; http sanilan
#      istekte tarayici onu saklamaz, giris sonsuz donguye girer.
# TLS'i nginx'in KENDISI sonlandiriyorsa (tunel yok, dogrudan 443) burayi
# $scheme yap.
proxy_set_header     X-Forwarded-Proto https;

# NOT: bir location kendi add_header'ini yazarsa server seviyesindekileri MIRAS
# ALMAZ; asagida gereken basliklar tekrar yaziliyor.

# --- service worker: ASLA uzun onbelleklenmez -----------------------------
# Eski sw.js takili kalirsa telefon gunlerce eski surumu servis eder.
location = /sw.js {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/"       always;
    add_header X-Content-Type-Options "nosniff" always;
}

# --- manifest: uygulamadan uretilir (start_url alan adina gore degisir) ---
location = /manifest.json {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache" always;
    add_header X-Content-Type-Options "nosniff"  always;
}

# --- statik: konteynerden, uzun onbellek ----------------------------------
# .macos.conf'tan farki: alias YOK. Dosyalar imajin icinde, ana makinede
# degil; uygulama /static, /static/d ve /static/m'i kendi servis ediyor
# (app.py:144-146).
location /static/ {
    proxy_pass http://ekiptakip;
    access_log off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location / {
    proxy_pass http://ekiptakip;
}
