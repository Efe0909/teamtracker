# EkipTakip — iki server blogunun paylastigi govde (macOS / Homebrew).
# macOS surumu: nginx-ekiptakip.macos.conf bunu iki server blogundan include eder.
# Kopyalama yok — dosya repodan okunur (servers/ altindaki symlink ile ayni mantik).

# --- KAPI -----------------------------------------------------------------
# alpha-0.1'in kendi kimlik dogrulamasi YOK (README "Bilgi güvenliği").
# Tercihen Cloudflare Access (deploy/README.md); onu kurduysan bu iki satiri kapat.
# Bu makinede kapi Cloudflare Access'te (tunelin ONUNDE) — auth_basic kapali.
# Access'i kaldirirsan asagidaki iki satiri ac ve parolayi uret:
#   htpasswd -c /opt/homebrew/etc/nginx/.htpasswd-ekiptakip efe
# auth_basic           "EkipTakip";
# auth_basic_user_file /opt/homebrew/etc/nginx/.htpasswd-ekiptakip;

# --- guvenlik basliklari --------------------------------------------------
add_header X-Frame-Options        "DENY"        always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "same-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
# CSP: sablonlarda satir ici <script> var, o yuzden 'unsafe-inline'. 'unsafe-eval'
# YOK — sablonlarda hx-on= kullanilmiyor (htmx onu new Function ile derler).
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

# --- yukleme siniri: medya ekleri (sozlesme §1 — 10 MB, tek dosya) --------
# 10 MB'lik gorselin kendisine multipart govde (sinir dizesi, form alani
# basliklari, `image` alaninin kendi Content-Type'i) birkac KB ekler. Siniri
# tam 10m birakirsan sinirin hemen ustundeki yuklemeler nginx'te KESILIR:
# istek uygulamaya hic ULASMAZ, ekiptakip'in kendi loglarinda hicbir iz
# birakmaz, yalnizca nginx erisim/hata gunlugunde gorunur. Boyle bir 413
# kafa karistirir — "uygulama neden boyle donuyor" diye aranir ama sorumlu
# katman nginx'tir, uygulama degil.
#
# 12m'e cikarken uygulamanin kendi erken reddini de goz onunde tut
# (shared/media.py cagrilmadan once rota Content-Length'e ~11 MB ustunde
# bakip erken reddeder — sozlesme §7): 12m, o esigin BIR TIK ustunde, boylece
# 10-11 MB araligindaki govdeler nginx'te degil UYGULAMADA reddedilir ve
# kullanici Turkce, anlamli bir hata gorur ("dosya cok buyuk") — cikta cikan
# nginx'in duz 413 sayfasi degil.
client_max_body_size 12m;
#
# proxy_request_buffering: varsayilan "on" BILEREK degistirilmiyor. "off"
# govdeyi nginx'te biriktirmeden dogrudan uygulamaya akitirdi — 10 MB gibi
# kucuk bir sinirda kazanci yok, ama uvicorn'un `--workers 1` ZORUNLULUGU
# (agac indeksi surec belleginde, spec/10-kararlar.md) TEK surecinin
# yavas/kotu niyetli bir yuklemeyle mesgul tutulmasina daha acik hale gelirdi.
# "on" kalinca nginx govdeyi once kendi tarafinda tamamliyor, uygulamaya
# istek TAMAMLANMADAN dusmuyor.
proxy_http_version   1.1;
proxy_set_header     Host              $host;      # ayrim buna bagli, sabitleme
proxy_set_header     X-Real-IP         $remote_addr;
proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header     X-Forwarded-Proto https;      # TLS cloudflared'de bitiyor
proxy_set_header     Connection        "";
proxy_read_timeout   30s;
proxy_send_timeout   30s;

# NOT: bir location kendi add_header'ini yazarsa server seviyesindekileri MIRAS
# ALMAZ; asagida gereken basliklar tekrar yaziliyor.

# --- service worker: ASLA uzun onbelleklenmez -----------------------------
# Eski sw.js takili kalirsa telefon gunlerce eski surumu servis eder.
location = /sw.js {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/"       always;
    add_header X-Content-Type-Options "nosniff" always;
}

# --- manifest: uygulamadan uretilir (start_url alan adina gore degisir) ---
location = /manifest.json {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache" always;
    add_header X-Content-Type-Options "nosniff"  always;
}

# --- statik dosyalar: nginx'ten -------------------------------------------
# app.py uc ayri dizin mount ediyor (app.py:144-146); nginx de ayni ucluye
# alias vermeli — sirali oncelik onemli, spesifik olanlar once.
# GECICI: su an worktree'deki (oauth-cloudflare-postgres-setup-fba08b) kod test
# ediliyor, path'ler o worktree'yi gosteriyor. Worktree silinince ana repo
# yollarina (bu dosyanin kendi dizini altindaki sites/dashboard/static vb.) geri al.
# expires kendisi Cache-Control yaziyor; ikinci kez add_header ile yazma.
location /static/d/ {
    alias /Users/Efe/projects/teamtracker/.claude/worktrees/oauth-cloudflare-postgres-setup-fba08b/sites/dashboard/static/;
    access_log off;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location /static/m/ {
    alias /Users/Efe/projects/teamtracker/.claude/worktrees/oauth-cloudflare-postgres-setup-fba08b/sites/mobil/static/;
    access_log off;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location /static/ {
    alias /Users/Efe/projects/teamtracker/.claude/worktrees/oauth-cloudflare-postgres-setup-fba08b/shared/static/;
    access_log off;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    proxy_pass http://ekiptakip;
}
