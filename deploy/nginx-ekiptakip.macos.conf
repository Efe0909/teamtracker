# EkipTakip — nginx ters vekil, iki alan adi (macOS / Homebrew surumu).
#
# deploy/nginx-ekiptakip.conf Linux + systemd + /etc/nginx/snippets varsayar.
# Bu makine darwin: nginx Homebrew ile kullanici olarak kosuyor, tunel uzaktan
# (dashboard) yonetimli — yerel config.yml yok sayilir, bkz. cloudflare-dashboard.md.
#
# Zincir:
#   telefon ──https──> Cloudflare ──tunel(temp)──> cloudflared
#            ──> nginx :8080 (server_name ile ayrisir) ──> uvicorn 127.0.0.1:8000
#
#   app.polonyum.com        → mobil site (kokte: /, /ara, /eylemler, /bildirimler)
#   dashboard.polonyum.com  → masaustu (ana sayfa, /gorevler, moduller)
#
# Ayrim BURADA yapiliyor. Uygulama Host basligina bakip mobil yolu kokte servis
# ediyor; uvicorn su degiskenlerle baslatilmali:
#   EKIPTAKIP_HOST_APP=app.polonyum.com
#   EKIPTAKIP_HOST_DASHBOARD=dashboard.polonyum.com
#   EKIPTAKIP_COOKIE_DOMAIN=.polonyum.com
#
# Kurulum (sudo YOK — nginx zaten Efe kullanicisinda):
#   ln -sf ~/projects/teamtracker/deploy/nginx-ekiptakip.macos.conf \
#          /opt/homebrew/etc/nginx/servers/ekiptakip.conf
#   nginx -t && nginx -s reload
#
# NOT: 8080'i push demosu (push.polonyum.com) ile paylasiyoruz. Orasi
# `listen 8080` (wildcard) yazdigi icin burada da wildcard kalmali —
# `listen 127.0.0.1:8080` yazarsan ayni portta ikinci bir socket baglanmaya
# calisir ve nginx acilmaz. Ayrisma server_name ile oluyor.
#
# Disariya acik tek yol tunel; uvicorn 127.0.0.1'e bagli, nginx'in 8080'i de
# yalnizca loopback'ten (cloudflared) geliyor.

upstream ekiptakip {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- 1) BILINMEYEN HOST: kapali ------------------------------------------
# servers/ alfabetik yukleniyor: ekiptakip.conf < push.polonyum.conf. Bu blok
# olmazsa 8080'in varsayilan sunucusu EkipTakip olur ve tunele dusen rastgele
# bir isim uygulamayi acar. push.polonyum.com kendi tam adiyla eslestigi icin
# bundan etkilenmez.
server {
    listen 8080 default_server;
    server_name _;
    return 444;                       # baglantiyi cevapsiz kapat
}

server {
    listen 8080;
    server_name app.polonyum.com;                 # ← MOBIL
    include /Users/Efe/projects/teamtracker/deploy/nginx-ekiptakip-ortak.macos.conf;
}

server {
    listen 8080;
    server_name dashboard.polonyum.com;           # ← MASAUSTU
    include /Users/Efe/projects/teamtracker/deploy/nginx-ekiptakip-ortak.macos.conf;
}
