# EkipTakip — nginx ters vekil (macOS / Homebrew sürümü).
#
# deploy/nginx-ekiptakip.conf Linux + systemd varsayar. Bu makine darwin:
# nginx Homebrew ile kullanıcı olarak koşuyor, tünel dashboard yönetimli.
#
# Zincir:
#   telefon ──https──> Cloudflare ──tünel(temp)──> cloudflared
#            ──> nginx :8080 (server_name ile ayrışır) ──> uvicorn 127.0.0.1:8000
#
# Kurulum (sudo YOK — nginx zaten Efe kullanıcısında):
#   ln -sf ~/projects/teamtracker/deploy/nginx-ekiptakip.macos.conf \
#          /opt/homebrew/etc/nginx/servers/ekiptakip.conf
#   nginx -t && nginx -s reload
#
# NOT: 8080'i push demosu (push.polonyum.com) ile paylaşıyoruz. Orası
# `listen 8080` (wildcard) yazdığı için burada da wildcard kalmalı —
# `listen 127.0.0.1:8080` yazarsan aynı portta ikinci bir socket bağlanmaya
# çalışır ve nginx açılmaz. Ayrışma server_name ile oluyor.
#
# Dışarıya açık tek yol tünel; uvicorn 127.0.0.1'e bağlı, nginx'in 8080'i de
# yalnızca loopback'ten (cloudflared) geliyor.

# Bilinmeyen Host ile gelen istek hicbir siteye dusmesin.
# Bu dosya servers/ altinda alfabetik olarak push.polonyum.conf'tan ONCE yukleniyor;
# default_server acikca belirtilmezse 8080'in varsayilani EkipTakip olur ve rastgele
# bir Host basligi uygulamaya erisir. 444 = yanit yazmadan baglantiyi kapat.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

upstream ekiptakip_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name ekiptakip.polonyum.com;

    # --- KAPI ---------------------------------------------------------------
    # Kapı Cloudflare Access'te (Zero Trust → Access → Applications), tünelin
    # ÖNÜNDE duruyor; istek buraya gelmeden önce kimlik doğrulanıyor.
    # Access'i kaldırırsan burayı aç ve parolayı üret:
    #   htpasswd -c /opt/homebrew/etc/nginx/.htpasswd-ekiptakip efe
    # auth_basic           "EkipTakip";
    # auth_basic_user_file /opt/homebrew/etc/nginx/.htpasswd-ekiptakip;

    # --- guvenlik basliklari ------------------------------------------------
    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # CSP: sablonlarda satir ici <script> ve hx-on: var, o yuzden script/style'da
    # 'unsafe-inline' duruyor. Dis kaynak yok — hepsi ayni kokten.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 2m;        # dosya yukleme yok, kucuk kalsin
    proxy_http_version   1.1;
    proxy_set_header     Host              $host;
    proxy_set_header     X-Real-IP         $remote_addr;
    proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header     X-Forwarded-Proto https;   # TLS Cloudflare'de bitiyor
    proxy_set_header     Connection        "";
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    # NOT: nginx'te bir location kendi add_header'ini yazarsa server seviyesindeki
    # add_header'lari MIRAS ALMAZ — asagidaki bloklarda gerekenler tekrar yaziliyor.

    # --- service worker: ASLA uzun onbelleklenmez ---------------------------
    location = /sw.js {
        proxy_pass http://ekiptakip_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/"       always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- statik dosyalar: nginx'ten, uygulamayi mesgul etme -----------------
    location = /static/manifest.json {
        alias /Users/Efe/projects/teamtracker/static/manifest.json;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        alias /Users/Efe/projects/teamtracker/static/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ekiptakip_app;
    }
}
