# EkipTakip — konteyner yigininin onundeki nginx (VM uzerinde, 8000'de).
#
# Zincir:
#   telefon ──https──> Cloudflare ──tunel──> cloudflared ──> nginx :8000
#                                                              │
#                                                              └──> 127.0.0.1:8001
#                                                                   (ekiptakip-app:8000)
#
# Kurulum (Debian/Ubuntu):
#   sudo cp deploy/nginx-ekiptakip-docker-ortak.conf \
#           /etc/nginx/snippets/ekiptakip-docker-ortak.conf
#   sudo cp deploy/nginx-ekiptakip-docker.conf \
#           /etc/nginx/sites-available/ekiptakip
#   sudo ln -sf /etc/nginx/sites-available/ekiptakip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Alan adlari uygulamada da tanimli olmali, yoksa ayrim yapilmaz ve mobil yuz
# yol onegi olmadan kokte kalir; ayrim Host'a gore yapilir (.env):
#   EKIPTAKIP_HOST_APP=app.polonyum.com
#   EKIPTAKIP_HOST_DASHBOARD=dashboard.polonyum.com
#   EKIPTAKIP_COOKIE_DOMAIN=.polonyum.com

upstream ekiptakip {
    # docker-compose.prod.yml uygulamayi YALNIZCA 127.0.0.1'e baglar.
    # APP_PORT'u degistirirsen burayi da degistir.
    server 127.0.0.1:8001;
    keepalive 8;
}

# --- bilinmeyen Host: baglantiyi kes --------------------------------------
# Ayrim server_name ile oluyor; eslesmeyen bir Host'a govde SERVIS ETME.
# Sunucuda baska bir default_server varsa nginx acilmaz — `nginx -t` soyler;
# o zaman ya digerini kaldir ya buradaki default_server sozcugunu sil.
server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;
    return 444;
}

# --- MOBIL: app.<alan> mobil yuzu KOKTE servis eder -----------------------
# /tasks burada 404 verir, kasten (masaustu yolu).
server {
    listen 8000;
    listen [::]:8000;
    server_name app.polonyum.com;
    include /etc/nginx/snippets/ekiptakip-docker-ortak.conf;
}

# --- MASAUSTU -------------------------------------------------------------
server {
    listen 8000;
    listen [::]:8000;
    server_name dashboard.polonyum.com;
    include /etc/nginx/snippets/ekiptakip-docker-ortak.conf;
}

