# EkipTakip — iki server blogunun paylastigi govde.
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/olusan/nginx-ekiptakip-ortak.conf /etc/nginx/snippets/ekiptakip-ortak.conf

# --- KAPI -----------------------------------------------------------------
# alpha-0.1'in kendi kimlik dogrulamasi YOK (README "Bilgi güvenliği").
# Tercihen Cloudflare Access (deploy/README.md); onu kurduysan bu iki satiri kapat.
#   sudo htpasswd -c /etc/nginx/.htpasswd-ekiptakip efe
auth_basic           "EkipTakip";
auth_basic_user_file /etc/nginx/.htpasswd-ekiptakip;

# --- guvenlik basliklari --------------------------------------------------
add_header X-Frame-Options        "DENY"        always;
add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "same-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
# CSP: sablonlarda satir ici <script> var, o yuzden 'unsafe-inline'. 'unsafe-eval'
# YOK — sablonlarda hx-on= kullanilmiyor (htmx onu new Function ile derler).
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

client_max_body_size 2m;
proxy_http_version   1.1;
proxy_set_header     Host              $host;      # ayrim buna bagli, sabitleme
proxy_set_header     X-Real-IP         $remote_addr;
proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header     X-Forwarded-Proto https;      # TLS cloudflared'de bitiyor
proxy_set_header     Connection        "";
proxy_read_timeout   30s;
proxy_send_timeout   30s;

# NOT: bir location kendi add_header'ini yazarsa server seviyesindekileri MIRAS
# ALMAZ; asagida gereken basliklar tekrar yaziliyor.

# --- service worker: ASLA uzun onbelleklenmez -----------------------------
# Eski sw.js takili kalirsa telefon gunlerce eski surumu servis eder.
location = /sw.js {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/"       always;
    add_header X-Content-Type-Options "nosniff" always;
}

# --- manifest: uygulamadan uretilir (start_url alan adina gore degisir) ---
location = /manifest.json {
    proxy_pass http://ekiptakip;
    proxy_hide_header Cache-Control;
    add_header Cache-Control          "no-cache" always;
    add_header X-Content-Type-Options "nosniff"  always;
}

# --- statik dosyalar: nginx'ten -------------------------------------------
# expires kendisi Cache-Control yaziyor; ikinci kez add_header ile yazma.
location /static/ {
    alias /home/efe/projects/teamtracker/static/;    # ← KENDİ YOLUN
    access_log off;
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    proxy_pass http://ekiptakip;
}
