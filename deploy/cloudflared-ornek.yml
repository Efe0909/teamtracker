# cloudflared ingress ornegi — MEVCUT config'ini bununla degistirme,
# sadece asagidaki kurallari kendi ingress listene ekle.
#
# ~/.cloudflared/config.yml  (ya da /etc/cloudflared/config.yml)
#
#   cloudflared tunnel route dns <tunel-adi> app.polonyum.com
#   cloudflared tunnel route dns <tunel-adi> dashboard.polonyum.com
#   sudo systemctl restart cloudflared
#
# DNS'i tek tek ekle: proxy'li wildcard kayit plana gore degisiyor, iki komut garanti.

tunnel: <TUNEL-ID>
credentials-file: /home/efe/.cloudflared/<TUNEL-ID>.json

ingress:
  # --- once VARSA mevcut kurallarin (push denemesi vs.) -------------------
  # - hostname: push.efeatcali.com
  #   service: http://127.0.0.1:5000

  # --- sonra EkipTakip: catch-all, ayrimi nginx yapar ---------------------
  # DIKKAT: httpHostHeader KOYMA. Host basligini sabitlersen nginx server_name
  # ile ayiramaz, iki alan adi da ayni bloga duser.
  - service: http://127.0.0.1:8080

  # Catch-all yerine acik isim istersen bunun yerine:
  # - hostname: app.polonyum.com
  #   service: http://127.0.0.1:8080
  # - hostname: dashboard.polonyum.com
  #   service: http://127.0.0.1:8080
  # - service: http_status:404          # ← o zaman son kural bu olur
